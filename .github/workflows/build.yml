name: Build package
on:
  push:
    tags:
      - '*'
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

jobs:

  test:
    name: Test Python behavior
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3-dev python3-venv python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libei1
        /usr/bin/python3 -m venv --system-site-packages .venv
        .venv/bin/pip install -e .
        .venv/bin/python -m unittest discover -v

  flatpak:
    name: Build Flatpak
    needs: test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
    - uses: actions/checkout@v7

    - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
      with:
        bundle: emote.flatpak
        manifest-path: com.tomjwatson.Emote.yml
        cache-key: flatpak-builder-${{ github.sha }}

    # - run: flatpak run com.tomjwatson.Emote

  snap:
    name: Build Snap
    needs: test
    runs-on: ubuntu-latest
    outputs:
      snap-file: ${{ steps.build-snap.outputs.snap }}
    steps:
    - uses: actions/checkout@v7

    - uses: snapcore/action-build@v1
      id: build-snap

    - run: |
        sudo snap install --dangerous ${{ steps.build-snap.outputs.snap }}

    # - run: emote

    - uses: actions/upload-artifact@v7
      with:
        name: emote-pkg
        path: ${{ steps.build-snap.outputs.snap }}

